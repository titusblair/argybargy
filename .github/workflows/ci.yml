name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Backend + CLI + unit tests across every supported Python. No browser needed,
  # so this stays fast and is the wide compatibility net.
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra test
      - name: Lint
        run: uv run ruff check .
      - name: Backend, CLI and unit tests
        # Skip anything that drives a real browser: this job has no Chromium.
        # Glob, not one filename, so a new tests/test_frontend_*.py is covered
        # the day it lands instead of failing the matrix first.
        run: uv run --extra test pytest --ignore-glob='tests/test_frontend_*.py'

  # Full suite including the real-browser dashboard tests, plus the coverage gate.
  # One Python version — downloading the browser is the expensive part.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra test
      - name: Install Chromium
        run: uv run --extra test playwright install --with-deps chromium
      - name: Full suite + coverage gate
        run: |
          uv run --extra test pytest \
            --cov=argybargy --cov-report=term-missing --cov-fail-under=90

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t argybargy:ci .
      - name: Smoke test container
        run: |
          docker run -d --name cc -p 8765:8765 argybargy:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8765/health && break || sleep 1
          done
          curl -sf http://localhost:8765/health | grep -q '"status":"ok"'
          curl -sf http://localhost:8765/dashboard | grep -q 'Argybargy'
          docker rm -f cc
